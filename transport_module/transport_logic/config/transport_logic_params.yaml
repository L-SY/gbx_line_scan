transport_logic_node:
  ros__parameters:
    # 启用控制（设置为 false 可以禁用某个电机）
    enable_zd_motor: true
    enable_servo_motor: true
    
    # ZD Motor 配置
    motor_device_path: "/dev/ttyACM1"
    motor_baud_rate: 19200
    motor_slave_address: 2
    
    # ZD Motor 速度配置 (RPM)
    reverse_speed_rpm: 3000
    forward_speed_rpm: 3000

    # WORK: 额外的 ZD 电机（slave id=3）速度 (RPM)，方向固定为 REVERSE
    work_speed_rpm: 200

    # WORK: 原始 ZD 电机抬升速度 (RPM)，用于 vertical_min_0 后等待10秒再 FORWARD 到 vertical_min_1
    work_lift_speed_rpm: 500
    
    # LC Servo Motor 配置
    servo_device_path: "/dev/ttyACM1"
    servo_baud_rate: 19200
    servo_slave_address: 1
    
    # LC Servo Motor 速度配置 (RPM)
    servo_forward_speed_rpm: 50.0
    servo_reverse_speed_rpm: 50.0
    
    # Microswitch 话题
    microswitch_topic: "/microswitch/data"
    
    # Distance Sensor 配置
    enable_distance_sensor: true
    distance_sensor_device_path: "/dev/ttyACM1"
    distance_sensor_baud_rate: 19200
    distance_sensor_slave_address: 4
    distance_sensor_publish_rate: 50.0
    empty_distance_threshold: 0.7